<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>头像动效</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#27272b;font:14px system-ui}main{height:100dvh;padding:24px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}h1{font-size:18px;margin:0}#stage{display:grid;place-items:center;min-height:0;container-type:size}#head{position:relative;width:min(80vw,90cqh,520px);aspect-ratio:1}footer{border-top:1px solid #ddd;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:8px 14px;border:1px solid #bbb;border-radius:5px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#e5e5df}label{display:flex;gap:6px}#status{margin-left:auto;color:#666}footer{display:grid;max-height:45dvh;overflow:hidden;grid-template-rows:auto minmax(0,1fr)}#controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#state-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;overflow:auto;min-height:0}select{font:inherit;padding:8px;background:transparent;border:1px solid #bbb;border-radius:5px}@media(max-width:650px){main{padding:14px}#state-grid{grid-template-columns:repeat(4,minmax(0,1fr))}button{padding:7px 8px}footer{max-height:52dvh}}</style><main><h1>头像动效</h1><section id="stage"><div id="head"></div></section><footer><div id="controls"><select id="state-select" aria-label="选择动效"></select><button id="previous">上一个</button><button id="next">下一个</button><button id="auto">自动切换</button><button id="pause">暂停</button><label><input id="follow" type="checkbox" checked>跟随鼠标</label><span id="status">待机</span></div><section id="state-grid" aria-label="全部动效"></section></footer></main><script type="module" src="preview.js?v=4"></script></html>
